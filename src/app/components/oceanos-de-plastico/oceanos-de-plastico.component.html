<main class="min-h-screen pt-36 pb-16 bg-gradient-to-b from-textWhite to-gray-50 rounded-lg">
  <section class="container mx-auto px-4 max-w-7xl">
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">

      <div class="grid lg:grid-cols-2 gap-8 p-8 lg:p-12">
        <div>
          <span class="inline-block px-4 py-2 bg-blue-100 text-blue-700 rounded-full text-sm font-semibold mb-4">
            {{ currentContent.badge }}
          </span>

          <h1 class="text-4xl lg:text-5xl font-extrabold text-primary mb-6 leading-tight">
            {{ currentContent.title }}
          </h1>

          <p *ngFor="let paragraph of currentContent.introduction" class="text-lg text-gray-700 leading-relaxed mb-6">
            {{ paragraph }}
          </p>

          <div class="flex flex-wrap gap-3 mb-6">
            <span *ngFor="let tag of currentContent.tags" class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-sm font-medium">
              {{ tag }}
            </span>
          </div>
        </div>

        <div>
          <img
            src="assets/images/oceanos-plastico/dentro-do-campus.jpeg"
            [alt]="currentContent.heroAlt"
            class="w-full h-[420px] object-cover rounded-2xl shadow-xl"
          />
        </div>
      </div>

      <div class="px-8 lg:px-12 pb-12">
        <div class="grid md:grid-cols-3 gap-6 mb-10">
          <div *ngFor="let card of currentContent.cards; let i = index" class="rounded-2xl p-6" [class.bg-blue-50]="i === 0" [class.bg-green-50]="i === 1" [class.bg-yellow-50]="i === 2">
            <h2 class="text-2xl font-bold text-primary mb-3">{{ card.title }}</h2>
            <p class="text-gray-700">{{ card.description }}</p>
          </div>
        </div>

        <div class="mb-10">
          <h2 class="text-3xl font-bold text-primary mb-6">{{ currentContent.galleryTitle }}</h2>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <img src="assets/images/oceanos-plastico/sem-as-garrafas.jpeg" [alt]="currentContent.galleryAlts[0]"
              class="w-full h-64 object-cover rounded-xl shadow-md" />
            <img src="assets/images/oceanos-plastico/desarrumadas.jpeg" [alt]="currentContent.galleryAlts[1]"
              class="w-full h-64 object-cover rounded-xl shadow-md" />
            <img src="assets/images/oceanos-plastico/organizadas.jpeg" [alt]="currentContent.galleryAlts[2]"
              class="w-full h-64 object-cover rounded-xl shadow-md" />
          </div>
        </div>
      </div>

    </div>
  </section>
</main>
